name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        run: npm run layer-token:check -- --base-ref origin/main

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies and headless Chrome
        run: npm ci

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-gate-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs src/codexOauthRealtime.test.mjs

      - name: Build production bundle
        run: npm run build

  production-runtime:
    name: Production runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install production dependencies only
        run: npm ci --omit=dev
      - name: Build the complete application
        run: npm run build
      - name: Verify production start and API serving
        run: |
          PORT=4317 HOST=127.0.0.1 npm start > production-start.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          node scripts/smoke-production.mjs http://127.0.0.1:4317
      - name: Production log on failure
        if: failure()
        run: cat production-start.log
